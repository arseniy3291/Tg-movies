name: Build CineGram iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - run: npm ci --prefix apps
      - run: npm --prefix apps run prepare:ios
      - name: Test native local API and media rewriting
        run: swift test --package-path apps/ios/Core --jobs 4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
      - name: Build unsigned iPhone application
        working-directory: apps/ios
        run: >-
          xcodebuild -project CineGram.xcodeproj -scheme CineGram -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA
        working-directory: apps/ios
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/CineGram.app build/package/Payload/
          cd build/package
          zip -qry ../CineGram-iOS-unsigned.ipa Payload
          cd ..
          shasum -a 256 CineGram-iOS-unsigned.ipa > SHA256SUMS-iOS.txt
      - name: Test launch on iPhone simulator
        working-directory: apps/ios
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcodebuild -project CineGram.xcodeproj -scheme CineGram -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        with:
          name: CineGram-iOS-unsigned
          path: |
            apps/ios/build/CineGram-iOS-unsigned.ipa
            apps/ios/build/SHA256SUMS-iOS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CineGram-iOS-UI-test-results
          path: apps/ios/build/UITests.xcresult
